<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dispatcher Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/auth.js"></script>
  <script>requireAuth();</script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h2>Dispatcher</h2>
      <nav>
        <a href="index.html" class="active">Orders</a>
        <a href="drivers.html">Drivers</a>
        <a href="live-map.html">Live Map</a>
        <a href="performance.html">Performance</a>
      </nav>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Orders</h1>
        <button id="syncOrdersBtn" class="small-btn" type="button">
          Sync from Shopify
        </button>
      </div>
      <p id="syncStatus" class="sync-status"></p>

      <!-- Every card is a button: clicking one opens the orders (or drivers)
           it counts, so the number is a way into the list rather than a
           dead end. -->
      <div class="stats-grid stats-grid-5">
        <button type="button" class="stat-card" data-stat="total">
          <p class="stat-title">Total Orders</p>
          <h3 id="totalOrders">0</h3>
          <span class="stat-hint">View orders</span>
        </button>

        <button type="button" class="stat-card" data-stat="unfulfilled">
          <p class="stat-title">Unfulfilled Orders</p>
          <h3 id="unfulfilledOrders">0</h3>
          <span class="stat-hint">View orders</span>
        </button>

        <button type="button" class="stat-card" data-stat="inProgress">
          <p class="stat-title">In Progress</p>
          <h3 id="inProgressOrders">0</h3>
          <span class="stat-hint">View orders</span>
        </button>

        <button type="button" class="stat-card" data-stat="delivered">
          <p class="stat-title">Delivered Orders</p>
          <h3 id="deliveredOrders">0</h3>
          <!-- Delivered orders are kept out of the table below, so this card is
               where they live now. -->
          <span class="stat-hint">View delivered</span>
        </button>

        <button type="button" class="stat-card" data-stat="availableDrivers">
          <p class="stat-title">Available Drivers</p>
          <h3 id="availableDrivers">0</h3>
          <span class="stat-hint">View drivers</span>
        </button>
      </div>

      <div class="filters-bar">
        <input
          type="text"
          id="searchOrder"
          placeholder="Search by order number"
        />

        <input
          type="tel"
          id="searchPhone"
          placeholder="Search by phone number"
        />

        <select id="statusFilter">
          <option value="">All statuses</option>
          <option value="UNFULFILLED">Unfulfilled</option>
          <option value="ASSIGNED">ASSIGNED</option>
          <option value="PICKED_UP">PICKED_UP</option>
          <!-- A carrier order reported as in transit lands here too, so this
               is where the parcels actually on the road are found. -->
          <option value="OUT_FOR_DELIVERY">OUT_FOR_DELIVERY</option>
          <option value="DELIVERED">DELIVERED</option>
          <option value="RETURNED">RETURNED</option>
          <option value="FULFILLED">FULFILLED</option>
        </select>

        <select id="cityFilter">
          <option value="">All cities</option>
        </select>

        <select id="areaFilter">
          <option value="">All areas</option>
        </select>
      </div>

      <div class="table-container">
        <table id="ordersTable">
          <thead>
            <tr>
              <th>Order #</th>
              <th>Customer</th>
              <th>Phone</th>
              <th>City</th>
              <th>Total</th>
              <th>Financial Status</th>
              <th>Order Status</th>
              <th>Assigned Driver</th>
              <th>Assign Driver</th>
              <th>Update Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="js/orders.js"></script>
</body>
</html>
