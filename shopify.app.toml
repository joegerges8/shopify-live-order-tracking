name = "DispatchHQ"
client_id = "6cc55b2c16983f7b719f69b9c3cad0b7"
application_url = "https://dispatcher-dashboard.up.railway.app/auth/"
embedded = false

[access_scopes]
# read_all_orders lifts the Admin API's default 60-day order history limit.
# The merchant_managed_fulfillment_orders scopes are what allow the app to
# fulfil orders shipped from the merchant's own locations — assigned_* only
# covers locations owned by a fulfilment service, so it is not enough here.
scopes = "read_all_orders,read_orders,write_orders,write_fulfillments,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders"

[auth]
redirect_urls = ["https://dispatcher-dashboard.up.railway.app/auth/callback"]

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/orders/create"

  # Delivers a merchant's edits to an order that already exists: the note, and
  # the products and amount after an order edit — a customer dropping an item
  # is only ever heard about here. Nothing else is read from this topic; see
  # handleOrderUpdated.
  [[webhooks.subscriptions]]
  topics = ["orders/updated"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/orders/updated"

  [[webhooks.subscriptions]]
  topics = ["orders/cancelled"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/orders/cancelled"

  [[webhooks.subscriptions]]
  topics = ["orders/delete"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/orders/delete"

  [[webhooks.subscriptions]]
  topics = ["orders/fulfilled"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/orders/fulfilled"

  # An outside carrier — Wakilni and the like — reports its progress against the
  # fulfilment rather than the order, so orders/fulfilled only ever sees the
  # first moment. Everything after it — Confirmed, In transit, Delivered —
  # arrives on these two topics and nowhere else.
  [[webhooks.subscriptions]]
  topics = ["fulfillments/create"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/fulfillments/create"

  [[webhooks.subscriptions]]
  topics = ["fulfillments/update"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/fulfillments/update"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = ["shop/redact"]
  uri = "https://dispatcher-dashboard.up.railway.app/webhooks/shopify/shop/redact"

